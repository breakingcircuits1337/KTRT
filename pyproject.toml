[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "ktrt"
version = "0.1.0"
description = "Knights of the Round Table Research — multi-model adversarial research orchestration service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
    # provider SDKs — Azure-only deployment uses the OpenAI SDK. The optional
    # anthropic/google/groq/mistral adapters are lazily imported only when their
    # model aliases are requested; install those extras via the "providers" group
    # if you enable them. Kept out of the base set to avoid httpx pin conflicts.
    "openai>=1.30.0",
    # research
    "trafilatura>=1.9.0",
    # storage
    "redis[asyncio]>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    # observability
    "structlog>=24.1.0",
    "python-ulid>=2.0.0",
]

[project.optional-dependencies]
providers = [
    "anthropic>=0.28.0",
    "google-generativeai>=0.7.0",
    "groq>=0.9.0",
    "mistralai>=1.0.0",
    "tavily-python>=0.3.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
